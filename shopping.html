<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Guide - Nick & Lizzy's Italy Honeymoon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --cream: #faf8f4;
      --warm: #f5f0e8;
      --terracotta: #c4764e;
      --navy: #2c3e50;
      --gold: #c9a96e;
      --gold-light: #e0c88a;
      --text: #3a3530;
      --text-light: #6b645c;
      --shadow: rgba(60, 50, 40, 0.12);
      --rose: #c27878;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top bar */
    .top-bar {
      background: var(--navy);
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    .top-bar h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 400;
      color: white;
    }

    .top-bar h1 em { color: var(--gold-light); font-style: italic; }

    .top-bar a {
      color: var(--gold-light);
      text-decoration: none;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.35rem 0.85rem;
      border: 1px solid rgba(224, 200, 138, 0.25);
      border-radius: 6px;
      transition: all 0.3s;
    }

    .top-bar a:hover {
      background: rgba(224, 200, 138, 0.1);
      border-color: var(--gold-light);
    }

    /* Main layout */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    .sidebar {
      width: 420px;
      flex-shrink: 0;
      background: var(--cream);
      border-right: 1px solid rgba(201, 169, 110, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1.5rem 1.5rem 1rem;
      border-bottom: 1px solid rgba(201, 169, 110, 0.12);
    }

    .sidebar-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 400;
      color: var(--navy);
      margin-bottom: 0.25rem;
    }

    .sidebar-header p {
      font-size: 0.8rem;
      color: var(--text-light);
      line-height: 1.5;
    }

    /* Filter tabs */
    .filter-bar {
      padding: 0.75rem 1.5rem;
      background: var(--warm);
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid rgba(201, 169, 110, 0.12);
      flex-wrap: wrap;
    }

    .filter-btn {
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      border: 1px solid rgba(201, 169, 110, 0.3);
      background: white;
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover { border-color: var(--gold); }

    .filter-btn.active {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
    }

    /* Store list */
    .store-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
    }

    .store-card {
      background: white;
      border-radius: 12px;
      padding: 1.15rem 1.25rem;
      margin-bottom: 0.6rem;
      box-shadow: 0 1px 8px var(--shadow);
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .store-card:hover {
      border-color: rgba(201, 169, 110, 0.3);
      transform: translateX(3px);
    }

    .store-card.active {
      border-color: var(--terracotta);
      box-shadow: 0 2px 16px rgba(196, 118, 78, 0.15);
    }

    .store-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .store-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .store-name {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--navy);
      line-height: 1.3;
    }

    .store-category {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--terracotta);
      font-weight: 500;
      margin-top: 0.15rem;
    }

    .store-desc {
      font-size: 0.78rem;
      color: var(--text-light);
      line-height: 1.5;
      margin-bottom: 0.6rem;
    }

    .store-details {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .store-detail {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      font-size: 0.73rem;
      color: var(--text-light);
    }

    .store-detail-icon {
      flex-shrink: 0;
      width: 16px;
      text-align: center;
      color: var(--gold);
    }

    .store-detail a {
      color: var(--terracotta);
      text-decoration: none;
    }

    .store-detail a:hover { text-decoration: underline; }

    .store-tag {
      display: inline-block;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 500;
      margin-top: 0.5rem;
    }

    .tag-food { background: rgba(196, 118, 78, 0.1); color: var(--terracotta); }
    .tag-ceramics { background: rgba(44, 62, 80, 0.08); color: var(--navy); }
    .tag-fashion { background: rgba(194, 120, 120, 0.12); color: var(--rose); }
    .tag-accessories { background: rgba(201, 169, 110, 0.15); color: #8a7440; }
    .tag-sandals { background: rgba(107, 124, 94, 0.1); color: #6b7c5e; }

    /* Map */
    .map-container { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }

    /* Custom markers */
    .shop-marker {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--navy);
      color: white;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      border: 2.5px solid white;
      transition: all 0.3s ease;
    }

    .shop-marker.active {
      background: var(--terracotta);
      transform: scale(1.3);
    }

    /* Popup */
    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      padding: 0;
    }

    .leaflet-popup-content { margin: 0; font-family: 'Inter', sans-serif; }

    .popup-inner { padding: 0.85rem 1rem; }

    .popup-inner h3 {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 0.15rem;
    }

    .popup-inner .popup-cat {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--terracotta);
      font-weight: 500;
      margin-bottom: 0.35rem;
    }

    .popup-inner p {
      font-size: 0.75rem;
      color: var(--text-light);
      line-height: 1.4;
    }

    /* Tip banner */
    .tip-banner {
      padding: 0.6rem 1.5rem;
      background: rgba(196, 118, 78, 0.06);
      border-bottom: 1px solid rgba(201, 169, 110, 0.12);
      font-size: 0.72rem;
      color: var(--text-light);
      line-height: 1.5;
    }

    .tip-banner strong { color: var(--terracotta); }

    /* Mobile */
    @media (max-width: 768px) {
      .main { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 50vh; border-right: none; border-top: 1px solid rgba(201, 169, 110, 0.15); }
      .map-container { height: 50vh; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>Nick & Lizzy &mdash; <em>Shopping Guide</em></h1>
    <a href="index.html" class="back-link">&larr; Back</a>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Ischia Shopping</h2>
        <p>Your curated list of stores to visit while on the island. Tap a store to see it on the map.</p>
      </div>

      <div class="tip-banner">
        <strong>Tip:</strong> Most shops close for riposo (afternoon break) around 1&ndash;4 PM. Plan morning or evening visits.
      </div>

      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="food">Food</button>
        <button class="filter-btn" data-filter="ceramics">Ceramics</button>
        <button class="filter-btn" data-filter="fashion">Fashion</button>
        <button class="filter-btn" data-filter="accessories">Accessories</button>
        <button class="filter-btn" data-filter="sandals">Sandals</button>
      </div>

      <div class="store-list" id="storeList">
        <!-- Built by JS -->
      </div>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script>
    const stores = [
      {
        id: 1,
        name: 'Serpico Specialita\' Di Ischia',
        category: 'food',
        categoryLabel: 'Local Food & Specialties',
        icon: '\uD83C\uDF4B',
        iconBg: 'rgba(196, 118, 78, 0.1)',
        tagClass: 'tag-food',
        lat: 40.7365,
        lng: 13.8587,
        rating: '4.3',
        desc: 'Local Ischian specialties \u2014 limoncello, honey, jams, dried peppers, handmade pasta, and other island delicacies. Perfect for bringing a taste of Ischia home.',
        address: 'Piazza Giacomo Matteotti 14, Forio',
        phone: '+39 081 997162',
        web: 'serpico.it',
        hours: 'Opens 8:00 AM',
        note: 'Great for edible souvenirs & gifts'
      },
      {
        id: 2,
        name: 'Il Pirata Ceramiche Artistiche',
        category: 'ceramics',
        categoryLabel: 'Handmade Ceramics',
        icon: '\uD83C\uDFA8',
        iconBg: 'rgba(44, 62, 80, 0.08)',
        tagClass: 'tag-ceramics',
        lat: 40.6989,
        lng: 13.8912,
        rating: '5.0 (1,554 reviews)',
        desc: 'Family-run ceramic studio in Sant\'Angelo. Hand-thrown and painted pieces \u2014 bowls, tiles, vases. "Mind blowing handmade pieces at any price." Ask for Cristiano!',
        address: 'Via Chiaia di Rose 42, Sant\'Angelo d\'Ischia',
        phone: '+39 081 999098',
        web: 'facebook.com',
        hours: 'Confirm hours \u2014 no set schedule listed',
        note: 'In-store pickup & delivery available'
      },
      {
        id: 3,
        name: 'Il Pellicano Outlet',
        category: 'fashion',
        categoryLabel: 'Women\'s Clothing Outlet',
        icon: '\uD83D\uDC5C',
        iconBg: 'rgba(194, 120, 120, 0.12)',
        tagClass: 'tag-fashion',
        lat: 40.7369,
        lng: 13.8587,
        rating: '4.0',
        desc: 'Women\'s clothing outlet in Forio with Italian-made fashion at discounted prices. Good for browsing, but double-check sale prices against tags.',
        address: 'Corso Francesco Regine 45, Forio',
        phone: '+39 081 997209',
        web: null,
        hours: 'Opens 9:30 AM',
        note: 'LGBTQ+ friendly \u2022 In-store pickup & delivery'
      },
      {
        id: 4,
        name: 'Le Signorine',
        category: 'accessories',
        categoryLabel: 'Women\'s Clothing & Accessories',
        icon: '\uD83D\uDC8D',
        iconBg: 'rgba(201, 169, 110, 0.15)',
        tagClass: 'tag-accessories',
        lat: 40.6962,
        lng: 13.8928,
        rating: '5.0',
        desc: '"Wonderful person with unique and special pieces." Beautifully curated boutique in Sant\'Angelo with shoes, clothing, and accessories. Owner Natalia knows her stuff.',
        address: 'Via Nazario Sauro 58, Sant\'Angelo d\'Ischia',
        phone: '+39 338 493 0753',
        web: 'facebook.com',
        hours: 'Opens 10:30 AM',
        note: 'Busiest on Sundays around 6 PM'
      },
      {
        id: 5,
        name: 'Baraonda di Ernesto Quaranta',
        category: 'sandals',
        categoryLabel: 'Clothing & Handmade Sandals',
        icon: '\uD83E\uDE74',
        iconBg: 'rgba(107, 124, 94, 0.1)',
        tagClass: 'tag-sandals',
        lat: 40.7299,
        lng: 13.8680,
        rating: '5.0',
        desc: 'Artisan handmade sandals plus curated resort wear and island-made jewelry. Owner Ernesto is welcoming and knowledgeable. "The best quality and a unique selection."',
        address: 'Via F. di Lustro 10, Forio',
        phone: '+39 338 672 2005',
        web: null,
        hours: 'Confirm hours with store',
        note: 'Custom sandals made on-site'
      },
      {
        id: 6,
        name: 'Marinella Boutique',
        category: 'fashion',
        categoryLabel: 'Swimwear & Fashion Boutique',
        icon: '\uD83D\uDC57',
        iconBg: 'rgba(194, 120, 120, 0.12)',
        tagClass: 'tag-fashion',
        lat: 40.7537,
        lng: 13.8843,
        rating: '4.5',
        desc: 'Swimwear, beachwear & handmade crochet/embroidery pieces by the genuine Mrs. Marinella in Lacco Ameno. "A change from tourist shops or luxury boutiques!"',
        address: 'Corso Angelo Rizzoli 170, Lacco Ameno',
        phone: '+39 081 994326',
        web: null,
        hours: 'Opens 10:00 AM',
        note: 'Handmade crochet & embroidery pieces'
      },
      {
        id: 7,
        name: 'Stella di Mare Boutique',
        category: 'fashion',
        categoryLabel: 'Curated Fashion Boutique',
        icon: '\u2B50',
        iconBg: 'rgba(201, 169, 110, 0.15)',
        tagClass: 'tag-fashion',
        lat: 40.7538,
        lng: 13.8852,
        rating: '5.0',
        desc: '"Very kind owners with an excellent, intentional curation of quality brands. This is what a true boutique feels like." Next door to Marinella in Lacco Ameno.',
        address: 'Corso Angelo Rizzoli 150, Lacco Ameno',
        phone: '+39 081 994396',
        web: 'instagram.com',
        hours: 'Opens 10:00 AM',
        note: 'Quality brand curation \u2022 Next to Marinella'
      }
    ];

    // Build store cards
    const storeList = document.getElementById('storeList');
    stores.forEach(s => {
      const card = document.createElement('div');
      card.className = 'store-card';
      card.dataset.id = s.id;
      card.dataset.category = s.category;
      const phoneHtml = s.phone ? `<div class="store-detail"><span class="store-detail-icon">\uD83D\uDCDE</span><a href="tel:${s.phone}">${s.phone}</a></div>` : '';
      const webHtml = s.web ? `<div class="store-detail"><span class="store-detail-icon">\uD83C\uDF10</span><a href="https://${s.web}" target="_blank">${s.web}</a></div>` : '';
      const ratingHtml = s.rating ? `<span style="font-size:0.7rem; color: var(--gold); margin-left: auto;">\u2605 ${s.rating}</span>` : '';
      card.innerHTML = `
        <div class="store-card-top">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:0.5rem">
              <div class="store-name">${s.name}</div>
              ${ratingHtml}
            </div>
            <div class="store-category">${s.categoryLabel}</div>
          </div>
          <div class="store-icon" style="background: ${s.iconBg}">${s.icon}</div>
        </div>
        <div class="store-desc">${s.desc}</div>
        <div class="store-details">
          <div class="store-detail">
            <span class="store-detail-icon">\uD83D\uDCCD</span>
            <span>${s.address}</span>
          </div>
          ${phoneHtml}
          ${webHtml}
          <div class="store-detail">
            <span class="store-detail-icon">\uD83D\uDD53</span>
            <span>${s.hours}</span>
          </div>
          <div class="store-detail">
            <span class="store-detail-icon">\u2728</span>
            <span>${s.note}</span>
          </div>
        </div>
      `;
      storeList.appendChild(card);
    });

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        document.querySelectorAll('.store-card').forEach(card => {
          if (filter === 'all' || card.dataset.category === filter) {
            card.style.display = '';
          } else {
            card.style.display = 'none';
          }
        });
      });
    });

    // Map
    const map = L.map('map', { zoomControl: false }).setView([40.7380, 13.9480], 15);
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
      maxZoom: 19
    }).addTo(map);

    // Markers
    const markers = {};

    function createShopIcon(emoji, isActive) {
      return L.divIcon({
        className: 'shop-marker-wrapper',
        html: `<div class="shop-marker ${isActive ? 'active' : ''}">${emoji}</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -18]
      });
    }

    stores.forEach(s => {
      const marker = L.marker([s.lat, s.lng], {
        icon: createShopIcon(s.icon, false)
      }).addTo(map);

      marker.bindPopup(`
        <div class="popup-inner">
          <div class="popup-cat">${s.categoryLabel}</div>
          <h3>${s.name}</h3>
          <p>${s.desc}</p>
          <p style="margin-top: 0.3rem; color: #c9a96e;">${s.hours}</p>
        </div>
      `, { maxWidth: 260 });

      markers[s.id] = marker;
    });

    // Fit all markers
    const allCoords = stores.map(s => [s.lat, s.lng]);
    map.fitBounds(allCoords, { padding: [50, 50], maxZoom: 16 });

    // Interactivity
    let activeId = null;

    function setActive(id) {
      document.querySelectorAll('.store-card').forEach(card => {
        card.classList.toggle('active', parseInt(card.dataset.id) === id);
      });
      stores.forEach(s => {
        markers[s.id].setIcon(createShopIcon(s.icon, s.id === id));
      });
      const store = stores.find(s => s.id === id);
      if (store) {
        map.flyTo([store.lat, store.lng], 17, { duration: 0.8 });
        markers[id].openPopup();
      }
      activeId = id;
    }

    // Card clicks
    document.querySelectorAll('.store-card').forEach(card => {
      card.addEventListener('click', () => {
        const id = parseInt(card.dataset.id);
        if (activeId === id) {
          activeId = null;
          document.querySelectorAll('.store-card').forEach(c => c.classList.remove('active'));
          stores.forEach(s => markers[s.id].setIcon(createShopIcon(s.icon, false)));
          map.fitBounds(allCoords, { padding: [50, 50], maxZoom: 16, duration: 0.8 });
          Object.values(markers).forEach(m => m.closePopup());
        } else {
          setActive(id);
        }
      });
    });

    // Marker clicks
    stores.forEach(s => {
      markers[s.id].on('click', () => {
        setActive(s.id);
        const card = document.querySelector(`.store-card[data-id="${s.id}"]`);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });
  </script>
</body>
</html>
